# ~/.config/tmux/tmux.conf
# -------------------------------------------------
# Tmux config – transparent bakgrund + powerline
#   • Prefix: Ctrl+Space
#   • Truecolor + powerline-status
# -------------------------------------------------

# ---- Grundläggande ----
set -g mouse on
set -g history-limit 10000
# ---- Prefix ----
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---- Terminal & färger ----
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'
# ---- Transparent bakgrund ----
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g status-style 'bg=default,fg=colour250'
set -g message-style 'bg=default,fg=colour250'
set -g pane-border-style 'fg=colour239,bg=default'
set -g pane-active-border-style 'fg=colour39,bg=default'

# ---- Keybindings ----
# Sesh + television session picker
bind-key "T" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh
# Sesh last session
bind -N "last-session (via sesh) " L run-shell "sesh last"
# Opencode popup (uses current pane path)
bind o display-popup -w 80% -h 80% -b "simple" -d "#{pane_current_path}" -E 'fish -c "opencode ."'
# ---- Sesh settings ----
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit tmux when closing a session

# ---- Snabb reload ----
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux config reloaded"

# ---- Plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'wfxr/tmux-fzf-url'

# Initiera TPM (behåll sist)
run '~/.config/tmux/plugins/tpm/tpm'
