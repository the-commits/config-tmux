# ~/.config/tmux/tmux.conf
# -------------------------------------------------
# Tmux config – transparent bakgrund + powerline
#   • Prefix: Ctrl+Space
#   • Truecolor + powerline-status
# -------------------------------------------------

# ---- Grundläggande ----
set -g mouse on
set -g history-limit 10000
# ---- Prefix ----
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---- Terminal & färger ----
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'
# ---- Transparent bakgrund ----
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g status-style 'bg=default,fg=colour250'
set -g message-style 'bg=default,fg=colour250'
set -g pane-border-style 'fg=colour239,bg=default'
set -g pane-active-border-style 'fg=colour39,bg=default'

# ---- Tangentbindningar ----
# Sesh + tv-sessionväljare
bind-key "S" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh
# Sesh - senaste session
bind -N "last-session (via sesh) " L run-shell "sesh last"
# Opencode: dela nederdelen (30%) som standard (använder aktuell panelväg)
# Prefix+o öppnar en nedre split med 30% höjd som kör samma kommando
bind o split-window -v -p 30 -c "#{pane_current_path}" 'fish -c "opencode -c ."'
# Behåll display-popup tillgänglig på Prefix+Ctrl+o
bind C-o display-popup -w 80% -h 70% -b "simple" -d "#{pane_current_path}" -E 'fish -c "opencode ."'
# ---- Sesh-inställningar ----
bind-key x kill-pane # hoppa över frågan "kill-pane 1? (y/n)"
set -g detach-on-destroy off  # avsluta inte tmux när en session stängs

# ---- Snabb reload ----
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux config reloaded"

# ---- Tillägg ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'wfxr/tmux-fzf-url'

# Initiera TPM (behåll sist)
run '~/.config/tmux/plugins/tpm/tpm'
